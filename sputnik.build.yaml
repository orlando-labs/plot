requires:
  sputnik: ">=1.0.0 <2.0.0"
schema: "sputnik.build.v1"
name: "plot"
version: "0.3.1"
source_root: "src"
profiles:
  required:
    - "core.v1"
    - "ffi.v1"
  optional: []
  forbidden: []
files:
  - "src/plot.s"
  - "native/plot_png.c"
  - "native/vendor/stb_image.h"
  - "native/vendor/README.md"
  - "README.md"
  - "API.md"
  - "THIRD_PARTY_NOTICES.md"
native_extensions:
  -
      name: "plot_png"
      language: "c"
      sources:
        - "native/plot_png.c"
      headers:
        - "native/vendor/stb_image.h"
      symbols:
        -
            logical: "plot.render_png"
            symbol: "sputnik_plot_render_png"
        -
            logical: "plot.render_3d_png"
            symbol: "sputnik_plot_render_3d_png"
        -
            logical: "plot.decode_image"
            symbol: "sputnik_plot_decode_image"
